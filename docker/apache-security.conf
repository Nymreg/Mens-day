<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex disabled
    DirectoryIndex index.php index.html
</Directory>
<Directory /var/www/html/config>
    Require all denied
</Directory>
<FilesMatch "(?i)\.(sql|pem|key|env)$">
    Require all denied
</FilesMatch>
